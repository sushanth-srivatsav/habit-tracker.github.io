<!DOCTYPE html>
<html>
<head>
    <title>Habit Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <h2>Enter Password</h2>
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="checkPassword()">Enter</button>
        <p id="errorMsg"></p>
    </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

    <h1 id="greeting"></h1>
    <button onclick="toggleMode()">Switch Mode</button>

    <div class="card">
        <h2>Add Goal</h2>
<input type="text" id="goalInput" placeholder="Enter Goal Name">
<input type="text" id="yLabelInput" placeholder="Y-Axis Label (e.g., Hours)">
<button onclick="addGoal()">Add</button>
<ul id="goalList"></ul>
    </div>

    <div class="card">
        <h2>Graph Controls</h2>
        <label>Day:</label>
        <input type="number" id="dayInput" min="1" max="31">

        <label>Value:</label>
        <input
    type="number"
    id="valueInput"
    step="0.001"
    min="0"
    placeholder="Enter value (e.g. 2.375)">

        <label>Y Max:</label>
        <input type="number" id="yMax" placeholder="Default 10">

        <button onclick="saveDayValue()">Save Entry</button>

        <br><br>
        <button onclick="changeMonth(-1)">Previous Month</button>
        <button onclick="changeMonth(1)">Next Month</button>

        <canvas id="goalChart"></canvas>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
